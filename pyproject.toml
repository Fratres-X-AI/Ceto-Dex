[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceto-dex"
version = "0.1.0"
description = "Ceto-Dex — video-native protected marine megafauna detection with refusal gates and replay evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Fratres X AI" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
ceto-dex-laptop = "cetodex.laptop_gate:main"
ceto-dex-recon = "cetodex.phase1_recon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
